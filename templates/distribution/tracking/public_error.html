<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خطأ في تتبع الشحنة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Cairo', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <div class="flex justify-between items-center mb-8">
            <div class="flex items-center">
                <img src="/static/uploads/images/katilo.png" alt="Katilo Logo" class="h-12 w-12 mr-3">
                <h1 class="text-2xl font-bold text-gray-800">تتبع الشحنة</h1>
            </div>
        </div>
        
        <!-- Error Message -->
        <div class="bg-white rounded-xl shadow-sm p-8 text-center">
            <div class="text-red-500 mb-4">
                <i class="fas fa-exclamation-circle text-6xl"></i>
            </div>
            <h2 class="text-xl font-bold text-gray-800 mb-2">حدث خطأ أثناء تتبع الشحنة</h2>
            <p class="text-gray-600 mb-4">لم نتمكن من العثور على شحنة برقم التتبع: <strong>{{ tracking_number }}</strong></p>
            
            {% if error_message %}
            <div class="bg-red-50 p-4 rounded-lg text-red-700 text-sm mt-4">
                {{ error_message }}
            </div>
            {% endif %}
            
            <div class="mt-6">
                <a href="/" class="inline-block px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700">
                    العودة إلى الصفحة الرئيسية
                </a>
            </div>
        </div>
        
        <!-- Footer -->
        <div class="mt-8 text-center text-gray-500 text-sm">
            <p>© {{ now.year }} قاتيلو. جميع الحقوق محفوظة.</p>
        </div>
    </div>
</body>
</html>
