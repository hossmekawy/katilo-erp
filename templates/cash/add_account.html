{% extends "base.html" %}

{% block title %}إدارة الخزينة - إضافة حساب{% endblock %}

{% block page_header %}إضافة حساب خزينة جديد{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-6">
    <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-sm overflow-hidden">
        <div class="p-6 border-b">
            <h2 class="text-lg font-semibold text-gray-800">بيانات الحساب الجديد</h2>
        </div>

        <form method="POST" action="{{ url_for('cash.add_account') }}" class="p-6">
            <div class="space-y-6">
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-1">اسم الحساب</label>
                    <input type="text" id="name" name="name" required
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                </div>

                <div>
                    <label for="account_type" class="block text-sm font-medium text-gray-700 mb-1">نوع الحساب</label>
                    <select id="account_type" name="account_type" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                        <option value="cash">نقدي</option>
                        <option value="bank">بنكي</option>
                        <option value="electronic">محفظة إلكترونية</option>
                        <option value="other">أخرى</option>
                    </select>
                </div>

                <div>
                    <label for="currency" class="block text-sm font-medium text-gray-700 mb-1">العملة</label>
                    <select id="currency" name="currency" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                        <option value="EGP">جنيه مصري (EGP)</option>
                        <option value="USD">دولار أمريكي (USD)</option>
                        <option value="EUR">يورو (EUR)</option>
                        <option value="SAR">ريال سعودي (SAR)</option>
                        <option value="AED">درهم إماراتي (AED)</option>
                    </select>
                </div>

                <div>
                    <label for="initial_balance" class="block text-sm font-medium text-gray-700 mb-1">الرصيد الافتتاحي</label>
                    <input type="number" id="initial_balance" name="initial_balance" step="0.01" min="0" value="0"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                    <p class="mt-1 text-xs text-gray-500">إذا كان الحساب يحتوي على رصيد بالفعل، أدخل المبلغ هنا.</p>
                </div>

                <div class="pt-4 border-t">
                    <div class="flex justify-end space-x-3 space-x-reverse">
                        <a href="{{ url_for('cash.accounts') }}" class="btn bg-gray-200 hover:bg-gray-300 text-gray-800">
                            إلغاء
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save ml-1"></i>
                            حفظ الحساب
                        </button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
