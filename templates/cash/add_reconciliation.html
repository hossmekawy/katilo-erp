{% extends "base.html" %}

{% block title %}إدارة الخزينة - إضافة جرد{% endblock %}

{% block page_header %}إضافة جرد خزينة جديد{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-6">
    <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-sm overflow-hidden">
        <div class="p-6 border-b">
            <h2 class="text-lg font-semibold text-gray-800">بيانات الجرد الجديد</h2>
        </div>

        <form method="POST" action="{{ url_for('cash.add_reconciliation') }}" class="p-6">
            <div class="space-y-6">
                <div>
                    <label for="account_id" class="block text-sm font-medium text-gray-700 mb-1">الحساب</label>
                    <select id="account_id" name="account_id" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                        <option value="">اختر الحساب</option>
                        {% for account in accounts %}
                        <option value="{{ account.id }}" data-balance="{{ account.current_balance }}" data-currency="{{ account.currency }}">
                            {{ account.name }} ({{ account.current_balance|round(2) }} {{ account.currency }})
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="system_balance" class="block text-sm font-medium text-gray-700 mb-1">رصيد النظام</label>
                        <input type="number" id="system_balance" name="system_balance" step="0.01" readonly
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-50 focus:ring-blue-500 focus:border-blue-500">
                        <p class="mt-1 text-xs text-gray-500">يتم حسابه تلقائياً من النظام</p>
                    </div>

                    <div>
                        <label for="actual_balance" class="block text-sm font-medium text-gray-700 mb-1">الرصيد الفعلي</label>
                        <div class="relative">
                            <input type="number" id="actual_balance" name="actual_balance" step="0.01" required
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <span id="currency-symbol" class="text-gray-500"></span>
                            </div>
                        </div>
                    </div>
                </div>

                <div>
                    <label for="difference" class="block text-sm font-medium text-gray-700 mb-1">الفرق</label>
                    <input type="number" id="difference" name="difference" step="0.01" readonly
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-50 focus:ring-blue-500 focus:border-blue-500">
                    <p id="difference-text" class="mt-1 text-xs"></p>
                </div>

                <div>
                    <label for="notes" class="block text-sm font-medium text-gray-700 mb-1">ملاحظات</label>
                    <textarea id="notes" name="notes" rows="3"
                              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500"></textarea>
                </div>

                <div class="pt-4 border-t">
                    <div class="flex justify-end space-x-3 space-x-reverse">
                        <a href="{{ url_for('cash.reconciliations') }}" class="btn bg-gray-200 hover:bg-gray-300 text-gray-800">
                            إلغاء
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save ml-1"></i>
                            حفظ الجرد
                        </button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const accountSelect = document.getElementById('account_id');
        const systemBalanceInput = document.getElementById('system_balance');
        const actualBalanceInput = document.getElementById('actual_balance');
        const differenceInput = document.getElementById('difference');
        const differenceText = document.getElementById('difference-text');
        const currencySymbol = document.getElementById('currency-symbol');

        // Update system balance when account changes
        accountSelect.addEventListener('change', function() {
            const selectedOption = this.options[this.selectedIndex];
            const systemBalance = selectedOption.dataset.balance || 0;
            const currency = selectedOption.dataset.currency || '';

            systemBalanceInput.value = parseFloat(systemBalance).toFixed(2);
            currencySymbol.textContent = currency;

            // Reset actual balance and recalculate difference
            if (actualBalanceInput.value) {
                calculateDifference();
            } else {
                differenceInput.value = '';
                differenceText.textContent = '';
            }
        });

        // Calculate difference when actual balance changes
        actualBalanceInput.addEventListener('input', calculateDifference);

        function calculateDifference() {
            const systemBalance = parseFloat(systemBalanceInput.value) || 0;
            const actualBalance = parseFloat(actualBalanceInput.value) || 0;
            const difference = actualBalance - systemBalance;

            differenceInput.value = difference.toFixed(2);

            // Update difference text with appropriate styling
            if (difference > 0) {
                differenceText.textContent = 'زيادة في الرصيد الفعلي عن رصيد النظام';
                differenceText.className = 'mt-1 text-xs text-green-600';
            } else if (difference < 0) {
                differenceText.textContent = 'عجز في الرصيد الفعلي عن رصيد النظام';
                differenceText.className = 'mt-1 text-xs text-red-600';
            } else {
                differenceText.textContent = 'الرصيد الفعلي مطابق لرصيد النظام';
                differenceText.className = 'mt-1 text-xs text-gray-600';
            }
        }

        // Form validation
        const form = document.querySelector('form');
        form.addEventListener('submit', function(event) {
            const accountId = accountSelect.value;
            const actualBalance = parseFloat(actualBalanceInput.value);

            if (!accountId) {
                event.preventDefault();
                alert('الرجاء اختيار الحساب');
                return;
            }

            if (isNaN(actualBalance) || actualBalance < 0) {
                event.preventDefault();
                alert('الرجاء إدخال رصيد فعلي صحيح');
                return;
            }
        });
    });
</script>
{% endblock %}
