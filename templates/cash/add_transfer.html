{% extends "base.html" %}

{% block title %}إدارة الخزينة - تحويل جديد{% endblock %}

{% block page_header %}إنشاء سند تحويل جديد{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-6">
    <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-sm overflow-hidden">
        <div class="p-6 border-b">
            <h2 class="text-lg font-semibold text-gray-800">بيانات التحويل الجديد</h2>
        </div>

        <form method="POST" action="{{ url_for('cash.add_transfer') }}" class="p-6" x-data="{ transferType: 'account' }">
            <div class="space-y-6">
                <div>
                    <label for="from_account_id" class="block text-sm font-medium text-gray-700 mb-1">من حساب</label>
                    <select id="from_account_id" name="from_account_id" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                        <option value="">اختر الحساب</option>
                        {% for account in accounts %}
                        <option value="{{ account.id }}" data-balance="{{ account.current_balance }}">
                            {{ account.name }} ({{ account.current_balance|round(2) }} {{ account.currency }})
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">نوع التحويل</label>
                    <div class="grid grid-cols-2 gap-4">
                        <label class="relative flex items-center p-3 rounded-lg border border-gray-300 cursor-pointer hover:bg-gray-50 transition-colors">
                            <input type="radio" name="transfer_type" value="account" required x-model="transferType"
                                   class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300">
                            <span class="mr-3 flex items-center text-gray-700">
                                <i class="fas fa-wallet text-blue-600 ml-2"></i>
                                <span>إلى حساب آخر</span>
                            </span>
                        </label>

                        <label class="relative flex items-center p-3 rounded-lg border border-gray-300 cursor-pointer hover:bg-gray-50 transition-colors">
                            <input type="radio" name="transfer_type" value="supplier" required x-model="transferType"
                                   class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300">
                            <span class="mr-3 flex items-center text-gray-700">
                                <i class="fas fa-truck text-green-600 ml-2"></i>
                                <span>إلى مورد</span>
                            </span>
                        </label>
                    </div>
                </div>

                <div x-show="transferType === 'account'">
                    <label for="to_account_id" class="block text-sm font-medium text-gray-700 mb-1">إلى حساب</label>
                    <select id="to_account_id" name="to_account_id" x-bind:required="transferType === 'account'"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                        <option value="">اختر الحساب</option>
                        {% for account in accounts %}
                        <option value="{{ account.id }}">
                            {{ account.name }} ({{ account.current_balance|round(2) }} {{ account.currency }})
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div x-show="transferType === 'supplier'">
                    <label for="supplier_id" class="block text-sm font-medium text-gray-700 mb-1">إلى مورد</label>
                    <select id="supplier_id" name="supplier_id" x-bind:required="transferType === 'supplier'"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                        <option value="">اختر المورد</option>
                        {% for supplier in suppliers %}
                        <option value="{{ supplier.id }}">{{ supplier.supplier_name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label for="amount" class="block text-sm font-medium text-gray-700 mb-1">المبلغ</label>
                    <input type="number" id="amount" name="amount" step="0.01" min="0.01" required
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                </div>

                <div>
                    <label for="notes" class="block text-sm font-medium text-gray-700 mb-1">ملاحظات</label>
                    <textarea id="notes" name="notes" rows="3"
                              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500"></textarea>
                </div>

                <div class="pt-4 border-t">
                    <div class="flex justify-end space-x-3 space-x-reverse">
                        <a href="{{ url_for('cash.transfers') }}" class="btn bg-gray-200 hover:bg-gray-300 text-gray-800">
                            إلغاء
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-exchange-alt ml-1"></i>
                            إنشاء التحويل
                        </button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.querySelector('form');
        const fromAccountSelect = document.getElementById('from_account_id');
        const toAccountSelect = document.getElementById('to_account_id');
        const amountInput = document.getElementById('amount');

        // Store account balances for validation
        const accountBalances = {};
        {% for account in accounts %}
        accountBalances[{{ account.id }}] = {{ account.current_balance }};
        {% endfor %}

        form.addEventListener('submit', function(event) {
            const fromAccountId = fromAccountSelect.value;
            const transferType = document.querySelector('input[name="transfer_type"]:checked')?.value;
            const toAccountId = toAccountSelect.value;
            const supplierId = document.getElementById('supplier_id')?.value;
            const amount = parseFloat(amountInput.value);

            // Validate from account selection
            if (!fromAccountId) {
                event.preventDefault();
                alert('الرجاء اختيار الحساب المصدر');
                return;
            }

            // Validate transfer type
            if (!transferType) {
                event.preventDefault();
                alert('الرجاء اختيار نوع التحويل');
                return;
            }

            // Validate destination based on transfer type
            if (transferType === 'account' && !toAccountId) {
                event.preventDefault();
                alert('الرجاء اختيار الحساب الوجهة');
                return;
            } else if (transferType === 'supplier' && !supplierId) {
                event.preventDefault();
                alert('الرجاء اختيار المورد');
                return;
            }

            // Validate amount
            if (isNaN(amount) || amount <= 0) {
                event.preventDefault();
                alert('الرجاء إدخال مبلغ صحيح أكبر من صفر');
                return;
            }

            // Check if transfer amount exceeds account balance
            if (amount > accountBalances[fromAccountId]) {
                event.preventDefault();
                alert('رصيد الحساب غير كافي لإجراء عملية التحويل');
                return;
            }

            // Prevent transferring to the same account
            if (transferType === 'account' && fromAccountId === toAccountId) {
                event.preventDefault();
                alert('لا يمكن التحويل إلى نفس الحساب');
                return;
            }
        });

        // Live validation for amount
        amountInput.addEventListener('input', validateTransferAmount);
        fromAccountSelect.addEventListener('change', validateTransferAmount);

        function validateTransferAmount() {
            const fromAccountId = fromAccountSelect.value;
            const amount = parseFloat(amountInput.value);

            if (!fromAccountId || isNaN(amount)) return;

            if (amount > accountBalances[fromAccountId]) {
                amountInput.setCustomValidity('رصيد الحساب غير كافي');

                // Add visual feedback
                amountInput.classList.add('border-red-500');

                // Show balance warning if not already present
                let warningEl = document.getElementById('balance-warning');
                if (!warningEl) {
                    warningEl = document.createElement('p');
                    warningEl.id = 'balance-warning';
                    warningEl.className = 'mt-1 text-sm text-red-600';
                    warningEl.textContent = `الرصيد المتاح: ${accountBalances[fromAccountId].toFixed(2)}`;
                    amountInput.parentNode.appendChild(warningEl);
                } else {
                    warningEl.textContent = `الرصيد المتاح: ${accountBalances[fromAccountId].toFixed(2)}`;
                }
            } else {
                amountInput.setCustomValidity('');
                amountInput.classList.remove('border-red-500');

                // Remove warning if exists
                const warningEl = document.getElementById('balance-warning');
                if (warningEl) warningEl.remove();
            }
        }

        // Prevent selecting the same account for source and destination
        toAccountSelect.addEventListener('change', function() {
            const fromAccountId = fromAccountSelect.value;
            const toAccountId = this.value;

            if (fromAccountId && toAccountId && fromAccountId === toAccountId) {
                this.setCustomValidity('لا يمكن التحويل إلى نفس الحساب');
                this.classList.add('border-red-500');

                // Show warning if not already present
                let warningEl = document.getElementById('same-account-warning');
                if (!warningEl) {
                    warningEl = document.createElement('p');
                    warningEl.id = 'same-account-warning';
                    warningEl.className = 'mt-1 text-sm text-red-600';
                    warningEl.textContent = 'لا يمكن التحويل إلى نفس الحساب';
                    this.parentNode.appendChild(warningEl);
                }
            } else {
                this.setCustomValidity('');
                this.classList.remove('border-red-500');

                // Remove warning if exists
                const warningEl = document.getElementById('same-account-warning');
                if (warningEl) warningEl.remove();
            }
        });

        // Also check when from account changes
        fromAccountSelect.addEventListener('change', function() {
            const toAccountId = toAccountSelect.value;
            if (toAccountId) {
                // Trigger the change event on toAccountSelect to run validation
                const event = new Event('change');
                toAccountSelect.dispatchEvent(event);
            }
        });
    });
</script>
{% endblock %}
