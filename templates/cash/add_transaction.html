{% extends "base.html" %}

{% block title %}إدارة الخزينة - إضافة معاملة{% endblock %}

{% block page_header %}إضافة معاملة جديدة{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-6">
    <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-sm overflow-hidden">
        <div class="p-6 border-b">
            <h2 class="text-lg font-semibold text-gray-800">بيانات المعاملة الجديدة</h2>
        </div>

        <form method="POST" action="{{ url_for('cash.add_transaction') }}" class="p-6">
            <div class="space-y-6">
                <div>
                    <label for="account_id" class="block text-sm font-medium text-gray-700 mb-1">الحساب</label>
                    <select id="account_id" name="account_id" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                        <option value="">اختر الحساب</option>
                        {% for account in accounts %}
                        <option value="{{ account.id }}" {% if request.args.get('account_id')|int == account.id %}selected{% endif %}>
                            {{ account.name }} ({{ account.current_balance|round(2) }} {{ account.currency }})
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label for="transaction_type" class="block text-sm font-medium text-gray-700 mb-1">نوع المعاملة</label>
                    <div class="grid grid-cols-2 gap-4">
                        <label class="relative flex items-center p-3 rounded-lg border border-gray-300 cursor-pointer hover:bg-gray-50 transition-colors">
                            <input type="radio" name="transaction_type" value="deposit" required
                                   class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300">
                            <span class="mr-3 flex items-center text-gray-700">
                                <i class="fas fa-arrow-down text-green-600 ml-2"></i>
                                <span>إيداع</span>
                            </span>
                        </label>

                        <label class="relative flex items-center p-3 rounded-lg border border-gray-300 cursor-pointer hover:bg-gray-50 transition-colors">
                            <input type="radio" name="transaction_type" value="withdrawal" required
                                   class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300">
                            <span class="mr-3 flex items-center text-gray-700">
                                <i class="fas fa-arrow-up text-red-600 ml-2"></i>
                                <span>سحب</span>
                            </span>
                        </label>
                    </div>
                </div>

                <div>
                    <label for="amount" class="block text-sm font-medium text-gray-700 mb-1">المبلغ</label>
                    <input type="number" id="amount" name="amount" step="0.01" min="0.01" required
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                </div>

                <div>
                    <label for="description" class="block text-sm font-medium text-gray-700 mb-1">الوصف</label>
                    <textarea id="description" name="description" rows="3"
                              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500"></textarea>
                </div>

                <div>
                    <label for="transaction_date" class="block text-sm font-medium text-gray-700 mb-1">تاريخ المعاملة</label>
                    <input type="date" id="transaction_date" name="transaction_date" value="{{ 'now'|now('%Y-%m-%d') }}" required
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                </div>

                <div class="pt-4 border-t">
                    <div class="flex justify-end space-x-3 space-x-reverse">
                        <a href="{{ url_for('cash.transactions') }}" class="btn bg-gray-200 hover:bg-gray-300 text-gray-800">
                            إلغاء
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save ml-1"></i>
                            حفظ المعاملة
                        </button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
    // Add validation to ensure sufficient balance for withdrawals
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.querySelector('form');
        const accountSelect = document.getElementById('account_id');
        const transactionTypeInputs = document.querySelectorAll('input[name="transaction_type"]');
        const amountInput = document.getElementById('amount');

        // Store account balances for validation
        const accountBalances = {};
        {% for account in accounts %}
        accountBalances[{{ account.id }}] = {{ account.current_balance }};
        {% endfor %}

        form.addEventListener('submit', function(event) {
            const accountId = accountSelect.value;
            const transactionType = document.querySelector('input[name="transaction_type"]:checked')?.value;
            const amount = parseFloat(amountInput.value);

            // Validate account selection
            if (!accountId) {
                event.preventDefault();
                alert('الرجاء اختيار الحساب');
                return;
            }

            // Validate transaction type
            if (!transactionType) {
                event.preventDefault();
                alert('الرجاء اختيار نوع المعاملة');
                return;
            }

            // Validate amount
            if (isNaN(amount) || amount <= 0) {
                event.preventDefault();
                alert('الرجاء إدخال مبلغ صحيح أكبر من صفر');
                return;
            }

            // Check if withdrawal amount exceeds account balance
            if (transactionType === 'withdrawal' && amount > accountBalances[accountId]) {
                event.preventDefault();
                alert('رصيد الحساب غير كافي لإجراء عملية السحب');
                return;
            }
        });

        // Update UI based on transaction type
        transactionTypeInputs.forEach(input => {
            input.addEventListener('change', function() {
                const withdrawalSelected = this.value === 'withdrawal';

                // Add visual indicator for withdrawal validation
                if (withdrawalSelected) {
                    amountInput.addEventListener('input', validateWithdrawalAmount);
                } else {
                    amountInput.removeEventListener('input', validateWithdrawalAmount);
                    amountInput.setCustomValidity('');
                }

                validateWithdrawalAmount();
            });
        });

        // Also validate when account changes
        accountSelect.addEventListener('change', validateWithdrawalAmount);

        function validateWithdrawalAmount() {
            const accountId = accountSelect.value;
            const transactionType = document.querySelector('input[name="transaction_type"]:checked')?.value;
            const amount = parseFloat(amountInput.value);

            if (!accountId || !transactionType || isNaN(amount)) return;

            if (transactionType === 'withdrawal' && amount > accountBalances[accountId]) {
                amountInput.setCustomValidity('رصيد الحساب غير كافي');

                // Add visual feedback
                amountInput.classList.add('border-red-500');

                // Show balance warning if not already present
                let warningEl = document.getElementById('balance-warning');
                if (!warningEl) {
                    warningEl = document.createElement('p');
                    warningEl.id = 'balance-warning';
                    warningEl.className = 'mt-1 text-sm text-red-600';
                    warningEl.textContent = `الرصيد المتاح: ${accountBalances[accountId].toFixed(2)}`;
                    amountInput.parentNode.appendChild(warningEl);
                } else {
                    warningEl.textContent = `الرصيد المتاح: ${accountBalances[accountId].toFixed(2)}`;
                }
            } else {
                amountInput.setCustomValidity('');
                amountInput.classList.remove('border-red-500');

                // Remove warning if exists
                const warningEl = document.getElementById('balance-warning');
                if (warningEl) warningEl.remove();
            }
        }
    });
</script>
{% endblock %}
