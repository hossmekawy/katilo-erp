{% extends "base.html" %}

{% block title %}اختيار ورقة العمل - استيراد قائمة المواد{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="bg-white rounded-lg shadow-md p-6">
        <h1 class="text-2xl font-bold mb-6 text-gray-800">اختيار ورقة العمل</h1>

        <div class="mb-6 p-4 bg-blue-50 rounded-md">
            <p class="text-gray-700">
                تم العثور على عدة أوراق عمل في ملف Excel. يرجى اختيار ورقة العمل التي تحتوي على بيانات قائمة المواد.
            </p>
        </div>

        <form action="{{ url_for('bom.select_sheet') }}" method="POST" class="space-y-6">
            <input type="hidden" name="file_path" value="{{ file_path }}">
            <input type="hidden" name="raw_material_category" value="{{ raw_material_category }}">
            <input type="hidden" name="final_product_category" value="{{ final_product_category }}">
            <input type="hidden" name="default_unit" value="{{ default_unit }}">

            <div>
                <label for="sheet_name" class="block text-sm font-medium text-gray-700 mb-1">
                    <i class="fas fa-table text-green-500 ml-1"></i> اختر ورقة العمل
                </label>
                <select id="sheet_name" name="sheet_name" required
                    class="mt-1 block w-full py-2 px-3 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                    {% for sheet in sheet_names %}
                        <option value="{{ sheet }}">{{ sheet }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="flex justify-end space-x-3 space-x-reverse">
                <a href="{{ url_for('bom.import_excel_form') }}" class="py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                    رجوع
                </a>
                <button type="submit" class="py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                    متابعة
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
