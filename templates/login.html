<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - كاتيلو</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap');
        
        * {
            font-family: 'Tajawal', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        
        .login-container {
            width: 100%;
            max-width: 450px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            overflow: hidden;
            position: relative;
        }
        
        .login-header {
            background: linear-gradient(to right, #f0fdf4, #dcfce7);
            padding: 2rem 1.5rem;
            text-align: center;
            border-bottom: 1px solid #e5e7eb;
        }
        
        .login-form {
            padding: 2rem;
        }
        
        .form-input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            transition: all 0.3s ease;
            text-align: right;
            padding-right: 2.5rem;
        }
        
        .form-input:focus {
            border-color: #22c55e;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2);
            outline: none;
        }
        
        .input-icon {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
        }
        
        .toggle-password {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            cursor: pointer;
        }
        
        .login-button {
            width: 100%;
            padding: 0.875rem;
            background: linear-gradient(to right, #22c55e, #16a34a);
            color: white;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1.125rem;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }
        
        .login-button:hover {
            background: linear-gradient(to right, #16a34a, #15803d);
            transform: translateY(-2px);
        }
        
        .login-button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        
        .decorative-shape {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }
        
        .shape-1 {
            width: 300px;
            height: 300px;
            top: -150px;
            right: -150px;
        }
        
        .shape-2 {
            width: 200px;
            height: 200px;
            bottom: -100px;
            left: -100px;
        }
        
        .error-message {
            background-color: #fee2e2;
            border: 1px solid #fecaca;
            color: #ef4444;
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
        }
        
        .loading-spinner {
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="decorative-shape shape-1"></div>
    <div class="decorative-shape shape-2"></div>
    
    <div class="login-container" x-data="loginForm()">
        <div class="login-header">
            <img src="https://ik.imagekit.io/tijarahub/optimized/Frontend-Ayehia/Vendors/Egypt/Katilo/Logo.png?1727273743029" alt="كاتيلو" class="h-16 mx-auto mb-4">
            <h2 class="text-2xl font-bold text-gray-800">مرحبًا بك في نظام كاتيلو</h2>
            <p class="text-gray-600 mt-2">سجل الدخول للوصول إلى حسابك</p>
        </div>
        
        <div class="login-form">
            <form @submit.prevent="submitLogin">
                <div x-show="errorMessage" class="error-message" x-text="errorMessage"></div>
                
                <div class="mb-6">
                    <label for="login_identifier" class="block text-sm font-medium text-gray-700 mb-2">البريد الإلكتروني أو اسم المستخدم</label>
                    <div class="relative">
                        <input 
                            type="text" 
                            id="login_identifier" 
                            x-model="formData.login_identifier" 
                            required
                            class="form-input"
                            placeholder="أدخل البريد الإلكتروني أو اسم المستخدم"
                        >
                        <i class="fas fa-user input-icon"></i>
                    </div>
                </div>
                
                <div class="mb-8">
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">كلمة المرور</label>
                    <div class="relative">
                        <input 
                            :type="showPassword ? 'text' : 'password'" 
                            id="password" 
                            x-model="formData.password" 
                            required
                            class="form-input"
                            placeholder="أدخل كلمة المرور"
                        >
                        <i class="fas fa-lock input-icon"></i>
                        <i 
                            @click="showPassword = !showPassword" 
                            :class="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"
                            class="toggle-password"
                        ></i>
                    </div>
                </div>
                
                <button 
                    type="submit" 
                    class="login-button"
                    :disabled="loading"
                >
                    <span x-show="!loading">تسجيل الدخول</span>
                    <div x-show="loading" class="flex items-center justify-center">
                        <i class="fas fa-circle-notch loading-spinner mr-2"></i>
                        <span>جاري التحميل...</span>
                    </div>
                </button>
            </form>
        </div>
    </div>
    
    <script>
        function loginForm() {
            return {
                formData: {
                    login_identifier: '',
                    password: ''
                },
                loading: false,
                errorMessage: '',
                showPassword: false,

                async submitLogin() {
                    this.loading = true;
                    this.errorMessage = '';

                    try {
                        const response = await fetch('/api/auth/login', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify(this.formData)
                        });

                        const data = await response.json();

                        if (!response.ok) {
                            this.errorMessage = data.message || 'خطأ في بيانات الدخول';
                            return;
                        }

                        window.location.href = data.redirect || '/dashboard';
                    } catch (error) {
                        this.errorMessage = 'حدث خطأ، حاول مجددًا';
                    } finally {
                        this.loading = false;
                    }
                }
            };
        }
    </script>
</body>
</html>
